# Unified reusable workflow for the flash-attention-for-sail PPU CI.
# Per-version differences are inputs only: `version` keys the job names, NAS
# paths, the branch cloned in actlize source modes and the build variants
# (only v2.8.2 builds fa3 in addition to fa2). fa3-specific handling stays
# internal to this workflow.
name: flash-attention UT Tests PPU

on:
  workflow_call:
    inputs:
      version:
        description: 'Target branch name (v2.7.2 / v2.7.4 / v2.8.2): job names, NAS paths and the branch cloned in actlize source modes.'
        required: true
        type: string
      matrix:
        description: 'JSON list of runners, e.g. ["ZW-810E","ZW-M890P"].'
        required: false
        type: string
        default: '["ZW-810E","ZW-M890P"]'
      source_mode:
        description: 'Source layout mode. Supported values: flash-attention, actlize0.8.0, actlize1.0.0.'
        required: false
        type: string
        default: flash-attention
  workflow_dispatch:
    inputs:
      version:
        description: 'Target branch name (v2.7.2 / v2.7.4 / v2.8.2).'
        required: true
        type: string
        default: v2.8.2
      matrix:
        description: 'JSON list of runners, e.g. ["ZW-810E","ZW-M890P"].'
        required: false
        type: string
        default: '["ZW-810E","ZW-M890P"]'
      source_mode:
        description: 'Source layout mode. Supported values: flash-attention, actlize0.8.0, actlize1.0.0.'
        required: false
        type: string
        default: flash-attention

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ci-ppu-fa-ut-${{ inputs.version }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SAIL_IMAGE: download.t-head.cn/docker_release/pytorch:sdk2.2.0-2.10.0-ubuntu24.04-hggcrt3-py312-20261005

jobs:
  build-test:
    name: flash-attention ${{ inputs.version }} ${{ matrix.variant }} (${{ matrix.runner }})
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(inputs.matrix || '["ZW-810E","ZW-M890P"]') }}
        # v2.8.2 additionally tests FA3 and the standalone Holmes raw ABI.
        variant: ${{ fromJson(inputs.version == 'v2.8.2' && '["fa2", "fa3", "holmes", "holmes-fa3"]' || '["fa2"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base..head diff below resolves both ends.
          fetch-depth: 0
          ref: ${{ startsWith(matrix.variant, 'holmes') && (github.event.pull_request.head.sha || github.sha) || github.sha }}
          # Fetch submodules (csrc/actlize provides cutlass headers) at checkout time, recursively.
          submodules: recursive
          persist-credentials: false
      - name: Build and Test ${{ matrix.variant }} on ${{ matrix.runner }}
        id: ppu-test
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ env.SAIL_IMAGE }}
          container_options: |
            cpus: "30"
            memory: "240g"
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=${{ matrix.runner }}"
          namespace: ppu-sched
          timeout_minutes: 420
          command: |
            set -ex
            # The image points pip and github.com at unreachable internal mirrors. Fix these
            # before source_mode handling because actlize mode clones the FA repository.
            unset PIP_INDEX_URL
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            VERSION='${{ inputs.version }}'
            # Use the caller-provided branch name as-is when cloning FA in actlize source modes.
            FA_BRANCH="$VERSION"
            SOURCE_MODE='${{ inputs.source_mode }}'
            case "$SOURCE_MODE" in
              ""|flash-attention)
                cd /workspace/source
                ;;
              actlize|actlize0.8.0|actlize1.0.0)
                cd /workspace
                FA_SOURCE=$(mktemp -d /workspace/fa-source.XXXXXX)
                rmdir "$FA_SOURCE"
                git config --global --add safe.directory '*'
                git clone --recurse-submodules -b "$FA_BRANCH" \
                  https://github.com/t-head/flash-attention-for-sail.git "$FA_SOURCE"
                ACTLIZE_SOURCE=$(mktemp -d /workspace/actlize-source.XXXXXX)
                rmdir "$ACTLIZE_SOURCE"
                mv /workspace/source "$ACTLIZE_SOURCE"
                rm -rf "$FA_SOURCE/csrc/actlize"
                mkdir -p "$FA_SOURCE/csrc"
                mv "$ACTLIZE_SOURCE" "$FA_SOURCE/csrc/actlize"
                mv "$FA_SOURCE" /workspace/source
                cd /workspace/source
                ;;
              *)
                echo "Unsupported source_mode: $SOURCE_MODE"
                exit 1
                ;;
            esac
            # PPU SDK and torch are pre-installed in the docker image
            source /usr/local/PPU_SDK/envsetup.sh
            VARIANT="${{ matrix.variant }}"
            if [[ "$VARIANT" == holmes* ]]; then
              pip install "setuptools==75.8.0" "packaging==24.2" psutil ninja pytest
              # /workspace/source is this workflow's checkout (PR head SHA),
              # or the explicitly assembled ACTLIZE dependency source mode.
              if [[ "$SOURCE_MODE" == "" || "$SOURCE_MODE" == "flash-attention" ]]; then
                export EXPECTED_FA_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
              else
                export EXPECTED_ACTLIZE_SHA='${{ github.event.pull_request.head.sha || github.sha }}'
              fi
              RESULT_DIR="/workspace/${VARIANT}-${{ github.run_id }}-${{ github.run_attempt }}"
              NAS_RESULT_DIR="/mnt/wl_nas/devops/flash-attention-ci/${VERSION}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/${VARIANT}"
              mkdir -p "$NAS_RESULT_DIR"
              # Preserve diagnostics even when build/test fails, and propagate failure.
              set +e
              HOLMES_RUNNER="tests/holmes/run.sh"
              if [[ "$VARIANT" == "holmes-fa3" ]]; then HOLMES_RUNNER="tests/holmes_fa3/run.sh"; fi
              bash "$HOLMES_RUNNER" "$RESULT_DIR"
              TEST_EXIT_CODE=$?
              COPY_EXIT_CODE=0
              for RESULT_FILE in "$RESULT_DIR"/*; do
                if [[ -f "$RESULT_FILE" ]]; then
                  cp "$RESULT_FILE" "$NAS_RESULT_DIR/" || COPY_EXIT_CODE=1
                fi
              done
              if [[ -d "$RESULT_DIR/dist" ]]; then
                cp -a "$RESULT_DIR/dist" "$NAS_RESULT_DIR/" || COPY_EXIT_CODE=1
              fi
              if [[ "$TEST_EXIT_CODE" -ne 0 ]]; then exit "$TEST_EXIT_CODE"; fi
              exit "$COPY_EXIT_CODE"
            fi
            # Drop any pre-installed flash-attn so the freshly built wheel takes effect.
            pip uninstall -y flash-attn flash-attn-3 || true
            export MAX_JOBS=20
            export PYTORCH_SAIL_ARCH="ppu_10;ppu_15"
            export FLASH_ATTENTION_FORCE_BUILD="TRUE"
            # Submodules are initialized by checkout or the source_mode clone above.
            # Pin build dependencies to avoid legacy fetching and old-packaging incompatibilities.
            pip install "setuptools==75.8.0" "packaging==24.2" psutil ninja
            VARIANT="${{ matrix.variant }}"
            VARIANT_UPPER="${VARIANT^^}"
            if [[ "$VARIANT" == "fa3" ]]; then
              BUILD_DIR="/workspace/source/hopper"
            else
              BUILD_DIR="/workspace/source"
            fi
            LOG_FILE="$BUILD_DIR/build_${VARIANT}.log"
            ERROR_LOG="$BUILD_DIR/error_${VARIANT}.log"
            echo "START TO BUILD ${VARIANT_UPPER} WHEEL IN $BUILD_DIR"
            # Builds may stay silent for a long time; print a heartbeat every 10 minutes.
            cd "$BUILD_DIR"
            python ./setup.py bdist_wheel > "$LOG_FILE" 2> "$ERROR_LOG" &
            BUILD_PID=$!
            echo "${VARIANT_UPPER} build started in background, pid=$BUILD_PID"
            set +x
            ELAPSED=0
            while kill -0 "$BUILD_PID" 2>/dev/null; do
                sleep 10
                ELAPSED=$((ELAPSED + 10))
                if (( ELAPSED % 600 == 0 )); then
                    echo "----- [$(date '+%F %T')] ${VARIANT_UPPER} build still running ($((ELAPSED / 60)) min), last 100 lines of $LOG_FILE -----"
                    tail -n 100 "$LOG_FILE" || true
                fi
            done
            set -x
            EXIT_CODE=0
            wait "$BUILD_PID" || EXIT_CODE=$?
            echo "${VARIANT_UPPER} build finished after ~$((ELAPSED / 60)) min, exit code $EXIT_CODE"
            if [[ "$EXIT_CODE" -ne 0 ]]; then
                echo "${VARIANT_UPPER} build failed with exit code $EXIT_CODE"
                cat "$ERROR_LOG"
                echo "----- last 100 lines of $LOG_FILE -----"
                tail -n 100 "$LOG_FILE"
                exit 1
            fi
            echo "${VARIANT_UPPER} wheel built successfully"
            echo "----- last 200 lines of $LOG_FILE -----"
            tail -n 200 "$LOG_FILE"
            # bdist_wheel leaves <pkg>.egg-info in BUILD_DIR; if it is on sys.path pip treats the
            # package as already installed and silently skips the wheel (so flash_attn_3._C is missing).
            rm -rf "$BUILD_DIR"/*.egg-info
            pip install "$BUILD_DIR"/dist/*.whl
            if [[ "$VARIANT" == "fa3" ]]; then
              pip show -f flash-attn-3 || true
              export PYTHONPATH="/workspace/source/hopper"
            else
              pip show -f flash-attn || true
            fi
            echo "START TO INSTALL TEST DEPS"
            pip install numpy==1.26.4 junit-xml einops
            pip install --upgrade pytest
            CASELIST=".github/workflows/scripts/casecmd.json"
            RESULT_FILE="test-results-${VARIANT}.xml"
            echo "START TO TEST ${VARIANT_UPPER} CASES FROM $CASELIST"
            cd /workspace/source
            # Keep going on test failures so the report is still copied to NAS for the summary.
            set +e
            python .github/workflows/scripts/pr-run-fa-ut.py \
              --caselist "$CASELIST" --suite "$VARIANT" --output "$RESULT_FILE"
            TEST_EXIT_CODE=$?
            # Record the runtime environment alongside the JUnit report.
            python3 .github/workflows/scripts/generate-env-info.py \
              --docker-image "${{ env.SAIL_IMAGE }}" \
              --output env_info.json
            # Keep results per runner and variant so the parallel matrix jobs do not collide.
            # Same layout for every FA version; run_id already makes it unique.
            NAS_RESULT_DIR="/mnt/wl_nas/devops/flash-attention-ci/${VERSION}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/${{ matrix.variant }}"
            mkdir -p "$NAS_RESULT_DIR"
            cp "$RESULT_FILE" "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success

      - name: Test summary (${{ matrix.variant }} / ${{ matrix.runner }})
        if: always()
        shell: bash
        run: |
          VARIANT="${{ matrix.variant }}"
          NAS_RESULT_DIR="/wl_nas/devops/flash-attention-ci/${{ inputs.version }}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/${VARIANT}"
          echo "## ${{ inputs.version }} ${VARIANT^^} results (${{ matrix.runner }})" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$VARIANT" == holmes* ]]; then
            XML_FILE="$NAS_RESULT_DIR/junit.xml"
            if [[ ! -f "$XML_FILE" ]]; then
              echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            python3 .github/workflows/scripts/display-test-summary.py "$XML_FILE"
            while read -r SHA256 ARTIFACT_PATH; do
              [[ "$ARTIFACT_PATH" == *.whl ]] || continue
              {
                printf '\n**Wheel:** `%s`\n\n' "${ARTIFACT_PATH##*/}"
                printf '**SHA256:**\n\n```text\n%s\n```\n\n' "$SHA256"
              } >> "$GITHUB_STEP_SUMMARY"
            done < "$NAS_RESULT_DIR/artifact.sha256"
            python3 "$NAS_RESULT_DIR/check_junit.py" "$NAS_RESULT_DIR/junit.xml"
            exit 0
          fi
          XML_FILE="$NAS_RESULT_DIR/test-results-${VARIANT}.xml"
          ENV_FILE="$NAS_RESULT_DIR/env_info.json"
          if [[ ! -f "$XML_FILE" ]]; then
            echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 .github/workflows/scripts/display-test-summary.py \
            "$XML_FILE" --env-info "$ENV_FILE"

      - name: Upload Holmes ABI evidence
        if: always() && startsWith(matrix.variant, 'holmes')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-abi-${{ inputs.version }}-${{ matrix.runner }}
          path: /wl_nas/devops/flash-attention-ci/${{ inputs.version }}/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}/${{ matrix.variant }}/
          if-no-files-found: error
