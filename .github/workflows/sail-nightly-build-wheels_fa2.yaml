name: sail nightly build fa2

on:
  push:
    branches:
      - 'ci/add_nightly_build_fj'
  schedule:
    # Daily at 11:30 UTC (19:30 Beijing time), same slot as the FA3 nightly.
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Name of the package to build and upload'
        required: true
        type: string
        default: flash_attn
      framework:
        description: 'Name of the dependent framework, e.g. torch'
        required: true
        type: string
        default: torch
      python_versions:
        description: 'JSON array; allowed values: 38, 310, 312'
        required: true
        type: string
        default: '["312"]'
      os_versions:
        description: 'JSON array; allowed values: ubuntu2004, ubuntu2204, ubuntu2404, alios7u2'
        required: true
        type: string
        default: '["ubuntu2404"]'
      runtime_versions:
        description: 'JSON array; allowed HGGCRT versions: 2, 3'
        required: true
        type: string
        default: '["3"]'
      torch_versions:
        description: 'JSON array; allowed values: 2.10.0, 2.13.0; [""] skips Torch installation'
        required: true
        type: string
        default: '["2.13.0"]'
      sdk_versions:
        description: 'JSON array; allowed values: 2.1.1, 2.2.0, 2.2.1'
        required: true
        type: string
        default: '["2.2.1"]'
      branch:
        description: 'Source branch, tag, or full commit SHA; leave empty to use the commit that triggered the workflow'
        required: false
        type: string
        default: ''
      package_version:
        description: 'Artifactory package version and automatic upload directory prefix; does not override the wheel version'
        required: true
        type: string
        default: '2.8.2'
      package_edition:
        description: 'Artifactory package edition; defaults to oe, matching the release workflow'
        required: true
        type: string
        default: oe
      package_type:
        description: 'Artifactory package type; defaults to pypi'
        required: false
        type: string
        default: pypi
      runs_on:
        description: 'CPU runner for all jobs; accepts a single label or a JSON array of labels'
        required: false
        type: string
        default: x86-ubuntu2404-8-32
      build_command:
        description: 'Custom Bash build command; leave empty to build FA2 from the repository root; only trusted configuration is accepted'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  # package_name keeps the FA2 and FA3 nightlies from cancelling each other.
  group: nightly-build-${{ inputs.package_name || 'flash_attn' }}-${{ inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: t-head/ci-infra/.github/workflows/nightly-build.yml@main
    secrets:
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
    with:
      runs_on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on || 'x86-ubuntu2404-8-32' }}
      # Scheduled runs carry no inputs; the pinned defaults below still apply.
      # Keep them aligned with the PR CI image: sdk2.2.0 / torch2.10.0 /
      # hggcrt3 / ubuntu24.04 / py312.
      package_name: ${{ inputs.package_name || 'flash_attn' }}
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: t-head/ci-infra
      template_ref: main
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["3"]' }}
      torch_versions: ${{ inputs.torch_versions || '["2.13.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.1"]' }}
      branch: ${{ inputs.branch || '' }}
      package_version: ${{ inputs.package_version || '2.8.2' }}
      package_edition: ${{ inputs.package_edition || 'oe' }}
      package_type: ${{ inputs.package_type || 'pypi' }}
      build_command: |
        ${{ inputs.build_command || 'unset PIP_INDEX_URL
        source /usr/local/PPU_SDK/envsetup.sh || true
        which hgcc || true
        echo "$PPU_SDK"
        # Drop any pre-installed flash-attn so the fresh wheel is the only candidate.
        pip uninstall -y flash-attn flash-attn-3 || true
        # The collector matches wheels by the flash_attn prefix, which also
        # matches hopper/dist/flash_attn_3-*.whl; clear leftovers first.
        rm -rf dist hopper/dist
        # Pin build dependencies to match the PR CI workflow (pr-fa-test-ppu.yaml).
        pip install "setuptools==75.8.0" "packaging==24.2" psutil ninja wheel
        export MAX_JOBS=20
        export PYTORCH_SAIL_ARCH="ppu_10;ppu_15"
        # Never fall back to the prebuilt wheels cached on GitHub releases.
        export FLASH_ATTENTION_FORCE_BUILD="TRUE"
        # FA2 builds from the repository root; the wheel lands in dist/.
        python3 setup.py bdist_wheel
        ls -lh dist/*.whl' }}
