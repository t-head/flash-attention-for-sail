name: flash-attention fa282 checkin     # ① Workflow 名称（显示在 Actions 页面）

# ② 触发条件
on:
  workflow_dispatch:                                       # 支持手动触发（网页/API）
  pull_request:
    branches: [v2.8.2, feature/add-ci-fa2.8.2]              # 目标分支为 v2.8.2 或该 CI feature 分支的 PR
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [v2.8.2, feature/add-ci-fa2.8.2]              # 推送到 v2.8.2 或该 CI feature 分支后再跑一次

permissions:                    # ③ Token 权限
  contents: read
  packages: write
  pull-requests: write
  statuses: write

concurrency:
  group: ci-ppu-fa282-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true                 # 新运行自动取消旧的

env:
  PPU_BASE_IMAGE: ${{ secrets.PPU_BASE_IMAGE }}
  SAIL_IMAGE: reg.docker.alibaba-inc.com/ai-tmp/pytorch:2.10.0-ubuntu24.04-hggcrt3-py312-ppu202609181903

jobs:
  build-test:
    name: Build & Test (FA2 + FA3)
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(inputs.matrix || '["ZW-M890P"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base..head diff below resolves both ends.
          fetch-depth: 0
          # Fetch submodules (csrc/actlize provides cutlass headers) at checkout time, recursively.
          submodules: recursive
      - name: Build and Test on PPU
        id: ppu-test
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ env.SAIL_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=${{ matrix.runner }}"
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            set -ex
            cd /workspace/source
            # Fix: image bakes in PIP_INDEX_URL pointing to unreachable internal server
            unset PIP_INDEX_URL
            # Fix: image bakes in git insteadOf redirecting github.com to unreachable internal gerrit
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            # PPU SDK and torch are pre-installed in the docker image
            source /usr/local/PPU_SDK/envsetup.sh
            # Drop any pre-installed flash-attn so the freshly built wheels take effect.
            pip uninstall -y flash-attn flash-attn-3 || true
            export MAX_JOBS=20
            export NVCC_THREADS=1
            export PYTORCH_SAIL_ARCH="ppu_10;ppu_15"
            export FLASH_ATTENTION_FORCE_BUILD="TRUE"
            echo "START TO INIT SUBMODULES"
            git config --global --add safe.directory /workspace/source
            # Pre-install setup_requires (packaging/psutil/ninja) via pip so setuptools does not
            # fall back to its legacy fetch_build_eggs against the unreachable internal index.
            # Pin setuptools and packaging to known-good versions: the image ships an old
            # packaging whose canonicalize_version() lacks the strip_trailing_zero kwarg that
            # newer setuptools calls when building wheel metadata (TypeError otherwise).
            pip install "setuptools==75.8.0" "packaging==24.2" psutil ninja
            git submodule update --init --recursive
            # TODO(fa2): temporarily disabled — only build FA3 for now.
            # echo "START TO BUILD FA2 WHEEL"
            # python ./setup.py bdist_wheel
            # pip install ./dist/*.whl
            echo "START TO BUILD FA3 (hopper) WHEEL"
            cd hopper
            LOG_FILE="build_fa3.log"
            ERROR_LOG="error_fa3.log"
            echo "开始构建 FA3 wheel..."
            python ./setup.py bdist_wheel > "$LOG_FILE" 2> "$ERROR_LOG"
            EXIT_CODE=$?

            # 检查返回值
            if [ $EXIT_CODE -ne 0 ]; then
                echo "FA3 build failed with exit code $EXIT_CODE"
                cat "$ERROR_LOG" # 显示错误详情
                echo "----- last 1000 lines of $LOG_FILE -----"
                tail -n 1000 "$LOG_FILE"
                exit 1
            else
                echo "✅ FA3 构建成功！"
                echo "----- last 200 lines of $LOG_FILE -----"
                tail -n 200 "$LOG_FILE"
            fi
            pip install ./dist/*.whl
            cd ..
            echo "START TO INSTALL TEST DEPS"
            pip install numpy==1.26.4 junit-xml einops
            pip install --upgrade pytest
            set +e
            # TODO(fa2): temporarily disabled — only test FA3 for now.
            # echo "START TO TEST FA2 CASES"
            # python .github/workflows/scripts/fa282_fa2_ut.py --output test-results-fa2.xml
            # FA2_EXIT_CODE=$?
            echo "START TO TEST FA3 CASES"
            export PYTHONPATH=/workspace/source/hopper
            python .github/workflows/scripts/fa282_fa3_ut.py --output test-results-fa3.xml
            FA3_EXIT_CODE=$?
            # Record the runtime environment alongside the JUnit report.
            python3 <<'PYEOF' > env_info.json
            import json
            import os
            import shutil
            import subprocess
            import sys

            def command_output(command):
                executable = command[0]
                if not shutil.which(executable):
                    return "not found"
                result = subprocess.run(command, text=True, capture_output=True, check=False)
                return (result.stdout or result.stderr).strip()

            info = {
                "docker_image": "${{ env.SAIL_IMAGE }}",
                "python_version": sys.version,
                "ppu_sdk": os.environ.get("PPU_SDK", ""),
                "ppu_home": os.environ.get("PPU_HOME", ""),
                "hggc_enable_compress": os.environ.get("HGGC_ENABLE_COMPRESS", ""),
                "pytorch_sail_arch": os.environ.get("PYTORCH_SAIL_ARCH", ""),
                "hggcc_version": command_output(["hggcc", "--version"]),
                "hggcrt_version": command_output(["hggcrt", "--version"]),
            }
            try:
                import torch
                info["torch_version"] = torch.__version__
            except ImportError:
                info["torch_version"] = "not found"
            print(json.dumps(info, indent=2, sort_keys=True))
            PYEOF
            # Copy the JUnit reports and runtime information to NAS for the runner.
            NAS_RESULT_DIR="/mnt/wl_nas/devops/flash-attention-ci/fa282/${{ github.run_id }}/${{ github.run_attempt }}"
            mkdir -p "$NAS_RESULT_DIR"
            # TODO(fa2): temporarily disabled.
            # cp test-results-fa2.xml "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp test-results-fa3.xml "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            # Fail the job if FA3 tests failed. (FA2 temporarily disabled.)
            if [[ "$FA3_EXIT_CODE" -ne 0 ]]; then
              exit 1
            fi
            exit 0
          cleanup_policy: on_success

      - name: Test summary
        if: always()
        shell: bash
        run: |
          NAS_RESULT_DIR="/wl_nas/devops/flash-attention-ci/fa282/${{ github.run_id }}/${{ github.run_attempt }}"

          # TODO(fa2): temporarily only summarize FA3.
          for variant in fa3; do
            XML_FILE="$NAS_RESULT_DIR/test-results-${variant}.xml"
            echo "## FA282 ${variant^^} results" >> "$GITHUB_STEP_SUMMARY"
            if [[ ! -f "$XML_FILE" ]]; then
              echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            python3 .github/workflows/scripts/display-test-summary.py "$XML_FILE"
          done
